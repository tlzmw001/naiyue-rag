name: Package validation
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release-tag:
        type: string
        required: false
        default: ''
    outputs:
      version:
        value: ${{ jobs.build.outputs.version }}
      wheel:
        value: ${{ jobs.build.outputs.wheel }}
      sdist:
        value: ${{ jobs.build.outputs.sdist }}
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      wheel: ${{ steps.version.outputs.wheel }}
      sdist: ${{ steps.version.outputs.sdist }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --no-cache-dir build==1.6.1 twine==6.2.0
      - name: Validate source version and release metadata
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: python scripts/release_tools.py version --tag "$RELEASE_TAG" --github-output "$GITHUB_OUTPUT"
      - run: python -m build
      - name: Audit exact distributions and PyPI description
        env:
          VERSION: ${{ steps.version.outputs.version }}
          WHEEL: ${{ steps.version.outputs.wheel }}
          SDIST: ${{ steps.version.outputs.sdist }}
        run: |
          python scripts/release_tools.py artifacts --dist dist --version "$VERSION"
          python scripts/inspect_distribution.py --expected-version "$VERSION" "dist/$WHEEL" "dist/$SDIST"
          python -m twine check --strict "dist/$WHEEL" "dist/$SDIST"
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7
  installed-artifact:
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      PYTHONUTF8: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - run: python -m pip install --no-cache-dir build==1.6.1
      - name: Install the exact built wheel away from the source directory
        run: python scripts/validate_candidate.py --wheel "dist/${{ needs.build.outputs.wheel }}" --expected-version "${{ needs.build.outputs.version }}" --venv .installed-venv
  formal-regression:
    needs: [build]
    runs-on: macos-15
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - run: python -m pip install --no-cache-dir "dist/${{ needs.build.outputs.wheel }}" pytest==9.1.1
      - name: Formal core and application regressions without private historical assets
        run: python scripts/run_formal_tests.py
