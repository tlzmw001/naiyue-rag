[build-system]
requires = ["setuptools==84.0.0", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "naiyue-rag"
dynamic = ["version"]
description = "Local Markdown knowledge retrieval with versioned evidence"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
  "openai==2.54.0", "jiter==0.17.0", "httpx==0.28.1", "python-dotenv==1.2.4",
  "PyYAML==6.0.3", "markdown-it-py==4.2.0", "langchain-text-splitters==1.1.3",
  "jieba==0.42.1", "numpy==2.5.3", "chromadb==1.5.9", "bm25s==0.3.13",
  "fastapi==0.162.0", "starlette==1.10.0", "uvicorn==0.54.0",
  "sentence-transformers==6.1.0", "transformers==5.20.0", "torch==2.14.1",
  "huggingface_hub==1.33.0", "safetensors==0.8.0", "scikit-learn==1.9.1",
  "narwhals==2.27.1", "scipy==1.18.1", "sympy==1.14.0", "mpmath==1.3.0", "threadpoolctl==3.7.0",
]

[project.urls]
Homepage = "https://github.com/tlzmw001/naiyue-rag"
Documentation = "https://github.com/tlzmw001/naiyue-rag/blob/main/docs/installation.md"
Issues = "https://github.com/tlzmw001/naiyue-rag/issues"

[project.scripts]
nyr = "naiyue_rag.cli:main"
nyr-embedding-audit = "naiyue_rag.validation.local_embedding_audit:main"

[tool.setuptools.dynamic]
version = {attr = "naiyue_rag._version.__version__"}

[tool.setuptools.packages.find]
include = ["naiyue_rag", "naiyue_rag.core", "naiyue_rag.encoding", "naiyue_rag.ingestion",
 "naiyue_rag.query", "naiyue_rag.reranking", "naiyue_rag.response", "naiyue_rag.storage",
 "naiyue_rag.validation", "naiyue_rag.resources", "naiyue_rag.serving"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
"naiyue_rag.resources" = ["config.yaml", "models.json"]

[tool.setuptools.cmdclass]
build_py = "packaging_support.FormalBuildPy"
