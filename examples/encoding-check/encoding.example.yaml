# Example model configuration. Credentials belong in the project .env, never here.
embedding:
  provider: openai_compatible
  base_url: https://open.bigmodel.cn/api/paas/v4/
  model: embedding-3
  expected_dimensions: 2048
  request_dimensions: null
  model_revision: null
  allowed_response_models:
    - embedding-3
representation:
  document_text_mode: raw
  text_layout: contexts_then_view
  document_prefix: ''
  query_prefix: ''
runtime:
  batch_size: 2
  max_inputs: 2
  max_input_utf8_bytes: 4096
  max_batch_input_utf8_bytes: 8192
  max_requests: 2
  timeout_seconds: 30
  deadline_seconds: 120
  max_response_bytes: 262144
