config_version: 1
paths:
  data_root: ./data
  knowledge_base_root: knowledge
models_file: models.json
retrieval:
  max_concurrent_queries: 2
  max_queued_queries: 20
  request_timeout_seconds: 180
  shutdown_timeout_seconds: 10
service:
  host: 127.0.0.1
  port: 8000
  access_token: null
  startup_timeout_seconds: 30
  shutdown_timeout_seconds: 10
  request_timeout_seconds: 180
  max_request_bytes: 1048576
ingestion:
  chunk_size: 1000
  chunk_overlap: 300
  chunking_policy: markdown-source-zh-v2
encoding:
  model: embedding
  representation:
    document_text_mode: labeled_case
    text_layout: contexts_then_view
    document_prefix: ''
    query_prefix: ''
  runtime:
    batch_size: 32
    max_inputs: 1000
    max_input_utf8_bytes: 32000
    max_batch_input_utf8_bytes: 128000
    max_requests: 4
    timeout_seconds: 30
    deadline_seconds: 60
    max_response_bytes: 4194304
sparse:
  min_chinese_term_length: 2
  lowercase: true
  cache_dir: cache/sparse
  max_terms_per_input: 10000
  max_resource_bytes: 33554432
storage:
  storage_root: indexes
  knowledge_base_id: default
  max_documents: 100
  max_chunks: 1000
  max_file_bytes: 1048576
  max_bundle_bytes: 33554432
  max_manifest_bytes: 65536
chroma:
  collection_name: knowledge_hub
  batch_size: 100
bm25:
  k1: 1.5
  b: 0.75
hybrid:
  dense_top_k: 20
  sparse_top_k: 20
  fusion_top_k: 10
  rrf_k: 60
  bm25_statistics_scope: global
  parallel_retrieval: true
rerank:
  backend: llm
  model: reranker
  top_k: 5
  max_candidates: 20
  max_input_characters: 64000
evidence:
  max_context_characters: 8000
  max_response_bytes: 262144
